<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink | 交換日記</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#f4c95d"/>
        <circle cx="14" cy="18" r="2.4" fill="#2a2550"/>
        <circle cx="26" cy="18" r="2.4" fill="#2a2550"/>
        <path d="M14 25 Q20 29 26 25" stroke="#2a2550" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Woolink</span>
      <span class="page-name">交換日記</span>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPanel">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="menu-panel" id="menuPanel" hidden>
    <a class="menu-item" href="placeholder.html?title=プロフィール">
      <span>プロフィール</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=お知らせ">
      <span>お知らせ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=設定">
      <span>設定</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ヘルプ">
      <span>ヘルプ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ログアウト">
      <span>ログアウト</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <main class="content">
    <section class="friend-card">
      <h1>友達一覧</h1>
    </section>

    <section class="diary-card">
      <p class="diary-status" id="diaryStatus">まだ今日は日記を書いていません</p>
      <div class="diary-action" id="diaryAction">
        <a class="write-btn" id="writeBtn" href="#">日記を書く！</a>
      </div>
    </section>

    <a class="history-row" href="placeholder.html?title=これまでの日記">
      <svg class="history-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <rect x="5" y="3" width="14" height="18" rx="2" fill="#eef0fb"/>
      </svg>
      <span>これまでの日記</span>
    </a>
  </main>

  <footer class="mascot-row">
    <svg class="mascot" viewBox="0 0 120 110" width="88" height="80" aria-hidden="true">
      <ellipse cx="60" cy="60" rx="52" ry="46" fill="#3a4a86"/>
      <circle cx="30" cy="24" r="8" fill="#3a4a86"/>
      <circle cx="90" cy="20" r="6" fill="#3a4a86"/>
      <circle cx="102" cy="34" r="5" fill="#3a4a86"/>
      <circle cx="42" cy="52" r="4" fill="#e7e6f2"/>
      <circle cx="70" cy="52" r="4" fill="#e7e6f2"/>
      <path d="M44 66 Q56 74 68 66" stroke="#e7e6f2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="60" y="94" text-anchor="middle" font-size="10" fill="#c9cbe8" font-family="'Zen Maru Gothic','Hiragino Sans',sans-serif">ハムスター</text>
      <text x="60" y="104" text-anchor="middle" font-size="10" fill="#c9cbe8" font-family="'Zen Maru Gothic','Hiragino Sans',sans-serif">すぎる</text>
    </svg>
    <div class="tip-bubble">写真から動画で日記を作ることもできるよ</div>
  </footer>

</div>

<script>
  /* ---------- 交換日記の状態管理（未執筆 → 送信済み(マッチ待ち) → 交換成立） ---------- */
  const diaryStatus = document.getElementById('diaryStatus');
  const diaryAction = document.getElementById('diaryAction');

  function renderDiaryState(state) {
    if (state === 'none') {
      diaryStatus.textContent = 'まだ今日は日記を書いていません';
      diaryAction.innerHTML = '<a class="write-btn" id="writeBtn" href="#">日記を書く！</a>';
      document.getElementById('writeBtn').addEventListener('click', (e) => {
        e.preventDefault();
        renderDiaryState('waiting');
        // デモ用: 実際にはマッチが成立するまでこの状態が続きます
        setTimeout(() => renderDiaryState('matched'), 2600);
      });
    } else if (state === 'waiting') {
      diaryStatus.textContent = '届け先を探しています';
      diaryAction.innerHTML = '';
    } else if (state === 'matched') {
      diaryStatus.textContent = '日記が交換されました！';
      diaryAction.innerHTML = '<a class="write-btn" href="placeholder.html?title=日記を見る">日記を見る</a>';
    }
  }

  renderDiaryState('none');

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  menuBtn.addEventListener('click', () => {
    const isOpen = !menuPanel.hidden;
    menuPanel.hidden = isOpen;
    menuBtn.classList.toggle('open', !isOpen);
    menuBtn.setAttribute('aria-expanded', String(!isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!menuPanel.hidden && !menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
      menuPanel.hidden = true;
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }
  });
</script>

</body>
</html>
